name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "MediaStudio Pro v1.2.0 - Cropper Foto & Video Interaktif & Tandai Warna Transparan"
          body: |
            ## 🎨 MediaStudio Pro v1.2.0 - Cropper Interaktif & Tandai Warna Transparan (Pipet)

            Rilis pembaruan **MediaStudio Pro v1.2.0** menambahkan fitur unggulan baru sesuai permintaan:
            
            ### 🚀 Fitur Baru v1.2.0:
            - ✂️ **Cropper Foto & Video Interaktif (Penanda Kotak):**
              - Dilengkapi kotak seleksi interaktif dengan 4 lingkaran penanda sudut yang dapat digeser bebas dengan jari.
              - Mendukung crop foto dan video bebas (freeform) serta rasio aspek (1:1, 4:5, 9:16, 16:9, 4:3).
              - Dilengkapi garis kisi pembantu (*Rule-of-Thirds Grid*) dan bayangan gelap di luar area crop.
            - 🎯 **Tandai Warna Jadikan BG Transparan (Pipet / Eyedropper):**
              - Cukup sentuh bagian warna apapun pada foto atau video, kaca pembesar (*magnifying loupe*) akan muncul menampilkan warna dan kode HEX secara akurat.
              - Begitu dilepas, warna yang ditandai tersebut langsung diubah menjadi transparan (*Alpha Transparency*) dengan kehalusan tepi otomatis!
              - Bekerja untuk foto maupun video (Chroma Key / Green Screen / Custom color removal).
            - 🧠 **AI Background Remover & Kuas Pemulih:** Segmentasi figur manusia Google ML Kit, kuas pemulih sentuh, dan proteksi warna kulit.

            - ✂️ **Potong & Sambung Video:** Trim video presisi milidetik dan sambungkan beberapa klip video menjadi satu.
            - 🖼️ **Ekstrak Frame Video:** Tangkap foto momen video dalam resolusi asli/4K secara instan atau beruntun.
            - 🔍 **Pencarian Emotikon & Stiker Google/Web:** Cari emotikon Unicode lengkap dan stiker web GIF/PNG transparan langsung dari keyword pencarian.
            - 🎵 **Mixer Audio Multi-Track & Efek Lengkap:** Ganti audio video, atur volume multi-track, speed tempo (0.5x - 2.0x), pitch shift (Chipmunk & Deep Voice), serta equalizer bass booster.
            - 📷 **Akses Kamera & Galeri:** Tangkap foto/video langsung lewat kamera HP atau pilih dari galeri.

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan instal langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
