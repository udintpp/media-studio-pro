name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.9
          name: "MediaStudio Pro v1.5.9 - Efek Bendera Berkibar, Kibaran Kain Alami & Cloth Wave Simulation"
          body: |
            ## 🚩 MediaStudio Pro v1.5.9 — Efek Bendera Berkibar & Kibaran Kain Alami

            Pembaruan **v1.5.9** menghadirkan simulasi kain dan bendera berkibar yang sangat realistis dengan teknologi mesh distortion Android native `Canvas.drawBitmapMesh()`.

            ---

            ### 🚀 Fitur Baru & Peningkatan di v1.5.9:

            1. 🚩 **Efek Bendera Berkibar & Kibaran Kain (Cloth Wave Simulation):**
               - Simulasi fisika kain 28×28 mesh vertex menggunakan `Canvas.drawBitmapMesh()` — gambar/video bergerak seperti kain atau bendera yang tertiup angin secara realistis.
               - **6 Arah Kibaran:** Kiri-ke-Kanan (bendera normal), Kanan-ke-Kiri, Atas-ke-Bawah, Bawah-ke-Atas, Diagonal, Gelombang Bebas.
               - **6 Mode Jangkar / Tiang:** Tiang Kiri (Bendera), Tiang Kanan, Batang Atas (Spanduk Vertikal), Batang Bawah, Gelombang Bebas, Dua Tiang (Spanduk Jalan).
               - **Kontrol Lengkap via Slider:** Kecepatan angin (0.2x–3.0x), Tinggi kibaran/amplitudo (5–80px), Kerapatan lipatan kain (0.4x–2.5x), Turbulensi/hembusan acak (0–80%).
               - **Bayangan Lekukan 3D:** Efek pencahayaan per-vertex cosine-based untuk ilusi kedalaman lipatan kain nyata — bisa ON/OFF.
               - **5 Preset Gaya Angin:** 🌬️ Semilir Angin (Breeze), 🚩 Bendera Normal, ⛈️ Badai Kencang (Storm), 🥻 Sutera Halus (Silk), 🏳️ Banner Vertikal.
               - Juga tersedia untuk layer tumpukan video/foto (Overlay/PIP) — mesh 20×20.

            2. 🔍 **Quick Apply Diperbarui:**
               - Ditambahkan "🚩 Bendera Berkibar & Kibaran Kain" di menu Quick Apply untuk akses satu-klik.

            3. ⚡ **Performa & Kompatibilitas:**
               - Rendering bitmap mesh teroptimasi tanpa frame-drop.
               - Dukungan ekspor 60 FPS ultra-smooth dari v1.5.8 tetap dipertahankan.

            ---

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan pasang langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
