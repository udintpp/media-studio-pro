name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.4
          name: "MediaStudio Pro v1.5.4 - Export Direct to DCIM/video-pro, New Year Fireworks & Eid Ketupat Particles"
          body: |
            ## 🎆 MediaStudio Pro v1.5.4 - Public Storage Export (DCIM/video-pro), New Year Fireworks & Lebaran Ketupat

            Pembaruan **MediaStudio Pro v1.5.4** membawa perbaikan penting pada penyimpanan hasil export agar langsung tersimpan di penyimpanan publik DCIM dan muncul di Galeri, serta penambahan efek partikel tematik spesial Tahun Baru dan Hari Raya Idul Fitri:

            ---

            ### 🚀 Fitur Baru & Peningkatan di v1.5.4:

            1. 📁 **Penyimpanan Export Langsung ke Storage Publik (`DCIM/video-pro`):**
               - Semua hasil export video (Editor Video, After Effects Studio VFX, Slideshow Foto, Pemotong/Penyambung Klip, dan Mixer Audio) kini tersimpan langsung di:
                 - `/storage/emulated/0/DCIM/video-pro/`
               - Terintegrasi penuh dengan `MediaStore` dan `MediaScannerConnection` sehingga **otomatis langsung muncul di Galeri / Foto dan Pengelola Berkas Android** tanpa delay.
               - Izin penyimpanan penuh (`MANAGE_EXTERNAL_STORAGE`, `WRITE_EXTERNAL_STORAGE`, `READ_EXTERNAL_STORAGE`).

            2. 🎆 **Simulasi Partikel Kembang Api Tahun Baru (New Year Fireworks):**
               - Efek kembang api spektakuler dengan fase roket meluncur dari bawah dengan ekor asap/api ke langit, meledak mekar radial 360° (*radial floral burst*), percikan kilau bertaburan dengan gaya gravitasi jatuh alami, kilat cahaya detonasi langit, dan variasi warna permata semarak (Ruby, Emas, Cyan, Zamrud, Violet).

            3. 🕌 **Simulasi Partikel Ketupat Lebaran (Eid Mubarak Festive):**
               - Dekorasi anyaman ketupat hijau zamrud & emas janur melayang anggun dengan gerakan mengayun lembut (*gentle sinusoidal swaying*), sepasang pita janur kelapa yang berkibar tertiup angin sepoi-sepoi, dan pendaran kilau bintang berkah Idul Fitri.

            4. ⚙️ **Integrasi Lengkap:**
               - Mendukung pengaturan jumlah partikel (10-300), kecepatan gerak, ukuran, palet warna, arah gerakan acak natural, dan bintang kilau *Star Glint*.

            5. ✨ **Partikel Cahaya Bling-Bling & Diamond Sparkles:**
               - Kilauan permata tajam dengan bintang 4-sudut berkilau (*4-point diamond cross flare*) yang berdenyut dinamis dan memancarkan pendaran cahaya mewah.

            6. 🌟 **Kunang-Kunang (Fireflies Bioluminescent Organik):**
               - Simulasi kunang-kunang melayang bebas di udara dengan pendaran cahaya hangat natural, bernapas lembut (*soft pulsing luminescence*), dan bergerak meliuk-liuk alami.

            7. ⭐ **Bintang & Kosmik (Twinkling Stars & Shooting Star):**
               - Hamparan bintang berkilau kosmik di langit malam dengan periode kedip acak, dilengkapi lintasan bintang jatuh / meteor berekor komet yang melesat secara berkala.

            8. 👑 **Debu Emas Mewah (Royal Gold Flakes) & Magic Fairy Dust:**
               - Serpihan debu emas 24K berkilauan yang melayang lembut terbawa hembusan angin halus dengan pantulan kilau metalik, serta debu sihir pelangi mistik.

            9. 🍃 **Gerakan Partikel Alami & Random Arah (Physics-based Organic Motion):**
               - Setiap partikel memiliki vektor kecepatan, frekuensi osilasi ganda, dan fase hidup independen sehingga **tidak lagi bergerak berbaris kaku bersamaan**.
               - 5 Pilihan Pola Gerakan: **Gerak Acak Alami (Random Wander / Brownian Motion)**, **Memancar Bebas 360° (Radial Burst)**, **Melayang Naik Organik (Upward Float with Wind)**, **Pusaran Kosmik (Vortex Swirl)**, dan **Melayang Turun Lembut (Downward Drift)**.
               - Pengaturan tingkat **Turbulensi & Keacakan Arah** (0.4x s/d 2.8x) untuk menentukan keliaran aliran partikel.

            10. 🎨 **9 Palet Warna Partikel Lengkap:**
               - **Emas Mewah (Royal Gold & Amber)**
               - **Berlian Cyan (Diamond Crystal)**
               - **Kunang-Kunang (Bioluminescent Lime-Yellow)**
               - **Pelangi Spektrum (Rainbow Holographic)**
               - **Kristal Putih (Pure Diamond White)**
               - **Ruby Merah (Ruby Crimson)**
               - **Zamrud Hijau (Emerald Glow)**
               - **Amethyst Ungu (Royal Violet)**
               - **Multi-Warna Spektakuler**

            11. ✨ **Kilauan Cahaya Sapuan Teks (Metallic Shimmer Sweep):**
               - Efek sapuan kilau cahaya diagonal (*luminous sheen sweep*) yang melintasi huruf-huruf teks timbul 3D secara berkesinambungan ala intro sinematik bioskop.
               - Kustomisasi warna kilau (Emas Murni, Perak Berlian, Cyan Neon, Rose Pink) dan kecepatan sapuan kilau.

            12. ⭐ **Kilauan Bintang di Sudut Teks (Star Glint Sparkles):**
               - Titik-titik bintang kilau 4-sudut tajam berkilip (*star flare glints*) di sudut-sudut huruf judul dengan rotasi dan pulsasi cahaya dinamis.

            13. 👑 **Koleksi Warna Emas Mewah Lengkap untuk Teks:**
               - Emas Murni 24K (`#FFD700`), Rose Gold Mewah (`#B76E79`), Champagne Gold Sinematik (`#F7E7CE`), Bronze Metalik (`#CD7F32`), dan Emas Kuning Cerah (`#FBBF24`).

            1. ⬛ **Knoll Unmult Alpha Keyer:**
               - Mengadopsi teknologi keyer standar industri untuk menghapus latar belakang hitam pekat (atau putih pekat) dari video stok (efek api, ledakan, asap, percikan kembang api, dust particles) dan mengubah luminansinya menjadi kanal transparansi alpha yang bersih secara instan.
               - Mendukung slider sensitivitas threshold luminance dan pilihan mode latar hitam/putih.

            2. 🎨 **Contour Paint Effect (Cel-Shading Outlines):**
               - Menganalisis kurva kontur luminansi objek pada video/foto untuk menggambar garis goresan artistik (cel-shading contour outlines) secara real-time.
               - Pilihan ketebalan garis: Tipis (1.5px), Sedang (3.0px), Tebal (5.0px), serta penyesuaian sensitivitas batas kontur.

            3. 🌪️ **Curl Noise Fluid Swirl (Simulasi Pusaran Fluida):**
               - Algoritma curl-noise prosedural matematika yang menghasilkan pita aliran fluida lembut (cyber stream ribbons / cosmic nebula) dengan interaksi gelombang trigonometrik organik.
               - Pengaturan kecepatan aliran (Slow Drift, Natural Flow, Rapid Vortex) yang bergerak dinamis mengikuti waktu playback.

            4. 📷 **3D Camera Depth of Field (Simulasi Kedalaman Lensa Kamera):**
               - Efek kedalaman optik kamera 3D dengan focal plane (Foreground 25%, Midground 50%, Background 75%) dan slider aperture bokeh blur lembut pada area di luar fokus.

            5. 🔍 **Quick Apply Command Bar (Akses Cepat Tool After Effects):**
               - Tombol pencarian cepat di bilah navigasi atas untuk melompat langsung ke efek atau alat mana pun (Glow, Glitch, Wiggle, Saber, Lumetri, Partikel, Motion Text, Stiker, Unmult, Contour, Curl, DOF, Guides, Snapshot, Komposisi) tanpa perlu menggulir menu.

            6. 📐 **Composition Guides & Grid Overlay (Presisi Komposisi Visual):**
               - **Rule of Thirds:** Garis panduan 3x3 dengan 4 titik emas pertemuan fokus.
               - **Broadcast Safe Areas:** Garis batas Action Safe (95%) dan Title Safe (90%) standar bioskop & siaran TV agar teks dan aksi tidak terpotong.
               - **Grid 4x4:** Garis grid simetri untuk meratakan objek dan teks.
               - Otomatis disembunyikan saat merender/mengeksport video final agar hasil tetap bersih.

            7. 📸 **Instant Frame Snapshot ke Clipboard:**
               - Tangkap frame video pada posisi milidetik saat ini dalam resolusi penuh, simpan otomatis ke galeri (`Pictures/MediaStudioPro_Snapshots/`), dan salin lokasi file langsung ke clipboard Android.

            1. 🎬 **Pemutaran Video Bergerak Real-time (Live Video Playback Engine):**
               - Memperbaiki masalah gambar video yang diam/statis saat tombol putar ditekan dan timer waktu berjalan.
               - Mengintegrasikan **TextureView** dan **MediaPlayer** hardware-accelerated sehingga frame video terputar mulus di 30-60 fps lengkap dengan audio yang sinkron.

            2. ⚡ **Double-Buffering & Zero-GC Frame Compositor:**
               - Menggunakan arsitektur double-buffering reusable bitmap buffer untuk merender efek visual After Effects di setiap frame video bergerak tanpa lag, tanpa *garbage collection stuttering*, dan tanpa lonjakan RAM.

            3. ⏩ **Timeline Scrubbing & Speed Ramping Sinkron:**
               - Menggeser seekbar timeline langsung melakukan *hardware seek* ke frame video yang tepat secara instan.
               - Pengaturan kecepatan video (*Speed Ramping 0.25x - 2.0x*) langsung diterapkan ke pemutar video secara dinamis.

            4. 📐 **Presisi Rasio Aspek Video (Fit-to-Aspect Canvas):**
               - Menyesuaikan rasio tampilan kontainer video secara otomatis baik untuk video lanskap maupun potret/vertikal (TikTok/Reels).

            1. ⚙️ **Kustom Durasi Komposisi (Custom Duration):**
               - Preset cepat: **3s, 5s, 10s, 15s, 30s, 60s**, serta input manual detik bebas hingga 300 detik.
               - Sinkronisasi real-time pada seekbar timeline scrubbing, keyframe engine, dan renderer frame.

            2. 📐 **Kustom Resolusi & Rasio Aspek (Aspect Ratio):**
               - Rasio layar standar industri: **16:9 Landscape (YouTube)**, **9:16 Vertikal (TikTok/Reels/Shorts)**, **1:1 Persegi (Instagram Feed)**, **4:5 Portrait**, dan **21:9 Ultrawide Bioskop**.
               - Resolusi render: **4K UHD (3840x2160)**, **2K QHD (2560x1440)**, **Full HD 1080p**, **HD 720p**, atau input manual px.

            3. 🎛️ **Parameter Partikel & Kecepatan Efek (Particle World Tuning):**
               - **Kecepatan Efek Global:** 0.25x hingga 3.0x (Hyper Speed).
               - **Jumlah Partikel (Density Count):** Slider/preset 15 hingga 200 partikel (Sparks, Rain, Snow, Bokeh).
               - **Kecepatan Gerak Partikel (Velocity):** 0.2x (Super Slow) hingga 3.0x (Maksimal).
               - **Ukuran Butiran Partikel:** 0.5x hingga 2.0x.

            4. ✨ **Motion Text Huruf Timbul 3D & Tipografi Lengkap:**
               - **Efek Huruf Timbul 3D (3D Extruded Bevel & Shadow):** Multi-layer depth (3px hingga 20px) dengan stroke kontur luar dan shadow halus.
               - **Pilihan Font Typography:** Monospace Hacker, Serif Sinematik, Sans-Serif Modern, Casual Script, dan Default Bold.
               - **Ukuran Huruf (Font Size):** 24sp hingga 110sp.
               - **Palet Warna Huruf:** Putih Murni, Emas Kemilau, Biru Neon Cyan, Pink Magenta, Hijau Limau Neon, Merah Crimson, Ungu, Hitam Pekat.
               - **7 Gaya Animasi Motion Text:** Typewriter, Kinetic Zoom Pop, Neon Pulse, Cyber Glitch, 3D Space Flip, Wave Bounce, Fade & Slide.

            5. 🎉 **Stiker & Emoji Animasi Interaktif (Animated Stickers):**
               - Pustaka stiker emoji dinamis: 🔥, ⚡, ✨, 🎬, 🚀, ❤️, 👑, 💯, 💥, 🌟, 🕶️, 🏆, 💎, 🍿, 🎯, 💣, 💫, 🪐, 🛸, 🎮.
               - 6 Tipe Animasi Fisik: **Denyut (Pulse)**, **Melompat Pantul (Bounce)**, **Berputar 360° (Spin)**, **Goyang (Wobble)**, **Mengapung Melayang (Float)**, atau Diam (None).
               - Pengaturan skala ukuran stiker (0.6x hingga 2.5x).

            6. 📍 **Reposisi Bebas Touch Drag di Layar Preview:**
               - Sentuh dan geser langsung teks atau stiker di atas layar preview untuk memindahkan posisi secara instan dan presisi.
               - Pilihan posisi preset (Atas, Tengah, Bawah, Kiri, Kanan).

            7. 🎬 **Hardware Video Export Engine:**
               - Export komposisi foto atau video menjadi format **MP4**, **MOV**, **GIF**, dan resolusi hingga **4K Ultra HD** dengan hardware MediaCodec & transformer.

            1. ⏱️ **Keyframe Animation Timeline Engine & Easing:**
               - Sisipkan titik keyframe dinamis untuk **Posisi (X, Y)**, **Skala (Scale)**, **Rotasi (Rotation)**, **3D Tilt X**, **3D Pan Y**, dan **Opasitas (Opacity)** di setiap milidetik timeline.
               - Interpolasi kurva kurva animasi: **Easy-Ease (Hermite)**, **Linear**, **Ease-In**, **Ease-Out**, **Bounce (Pegas)**, dan **Elastic (Osilasi)**.
               - Pratinjau transport playback instan (Play/Pause, Scrubbing seekbar, indikator jumlah keyframe aktif).

            2. 🧊 **3D Layer Space (After Effects 3D Switch):**
               - Transformasi layer dalam ruang 3 dimensi berbasis kamera perspektif Android: **3D Tilt X (Pitch)**, **3D Pan Y (Yaw)**, dan jarak kamera Z.

            3. 🎭 **Masking & Rotoscoping Engine:**
               - Pemotongan area dengan Shape Masks: **Kotak Persegi (Rectangle)** dan **Lingkaran Oval (Ellipse)**.
               - Fitur **Mask Feathering** (tepi halus) dan **Invert Mask** (pembalikan area luar).

            4. ⚡ **Speed Ramping & Time Remapping:**
               - Pengaturan kecepatan dinamis: Super Slow-Mo (0.25x), Slow Motion (0.5x), Normal (1.0x), Cepat (1.5x), Hyperlapse (2.0x), serta **Putar Mundur (Reverse Time)**.

            5. ☀️ **CC Light Rays (Volumetric God Rays):**
               - Pancaran berkas sinar cahaya volumetrik berkilau memancar dramatis dari pusat hotspot cahaya dengan rotasi angular dinamis.

            6. 🌊 **Turbulent Displace (Liquify Distort):**
               - Distorsi riak gelombang cairan, efek panas atmosferik, dan asap dinamis khas After Effects.

            7. 🌀 **CC Radial Fast Blur (Zoom Blur):**
               - Efek zoom burst radial eksplosif ke arah pusat untuk transisi aksi berkecepatan tinggi.

            8. ⚡ **Saber Laser & Neon Edge Glow:**
               - Kontur garis tepi laser berenergi tinggi bercahaya neon ala plugin Video Copilot Saber.

            9. 🎨 **Lumetri Color Grading Curves:**
               - Koleksi grading warna bioskop: **Teal & Orange Hollywood**, **Cyberpunk Neon**, **Film Noir B&W Dramatis**, **Matrix Emerald**, dan **Vintage Golden Hour**.

            10. 🌟 **Optical Deep Glow (VFX Radiance):**
               - Efek pendaran cahaya optik neon pekat (*radiance glow*) dengan ambang batas dinamis, radius difusi sehalus studio bioskop, dan pilihan palet warna neon.

            11. ⚡ **RGB Split & Glitch Distortion:**
               - Simulasi aberasi kromatik kanal warna Red dan Cyan terpisah bergaya cyberpunk.
               - Dilengkapi pemisah baris pindai horizontal (*scanlines*) dan jittering acak berkecepatan tinggi.

            12. 📳 **Camera Wiggle Shake (`wiggle(freq, amp)`):**
               - Simulasi goyangan kamera genggam organik natural (*handheld camera shake*) ala ekspresi After Effects `wiggle(freq, amp)` dengan pengaturan frekuensi (Hz) dan amplitudo getaran.

            13. ☀️ **Anamorphic Lens Flare Sinematik:**
               - Kilatan lensa bioskop Hollywood dengan garis streak horizontal cyan/emas, cincin refleksi aberasi optik sekunder, dan titik pusat cahaya (*hotspot flare*).

            14. ✨ **Particle World Simulation (Simulasi Partikel Fisik):**
               - **Sparks & Embers:** Percikan api dan bara melayang dinamis dengan simulasi gravitasi dan peluruhan ukuran.
               - **Rain & Mist:** Simulasi atmosferik tetesan hujan deras sinematik dengan kabut.
               - **Snow Drift:** Butiran salju melayang lembut dengan pengaruh turbulensi angin acak.
               - **Bokeh Orbs:** Lingkaran bias cahaya aperture lebar lensa fotografi dengan kedalaman optik (*depth of field*).

            15. 🎞️ **35mm Celluloid Film Grain:**
               - Tekstur butiran film analog 35mm dengan getaran eksposur halus khas proyektor bioskop klasik.

            16. 🔤 **Kinetic Motion Graphics Typography:**
               - Animasikan teks judul dengan gaya: **Typewriter** (efek mesin tik per huruf), **Kinetic Pop Zoom**, **Neon Pulse**, dan **Glitch Distortion**.

            17. 🎵 **Audio Waveform Spectrum Visualizer:**
               - Visualisasi grafis gelombang frekuensi suara neon interaktif yang bereaksi terhadap dentuman audio.

            18. 🎭 **Layer Blending Modes Profesional:**
                - Pilihan mode perpaduan layer: **Normal**, **Add (Linear Dodge)**, **Screen**, **Multiply**, **Overlay**, **Lighten**, **Darken**, dan **Difference / XOR**.

            19. 🎬 **Export Resolusi Tinggi Hingga 4K & Format Terlengkap:**
                - Pilihan resolusi: **4K Ultra HD (3840x2160)**, **2K QHD**, **1080p Full HD**, **720p HD**, dan **Ukuran Asli**.
                - Format video: **MP4**, **MOV**, **WEBM (dengan alpha channel)**, **MKV**, **AVI**, **3GP**, dan **GIF Animasi**.
                - Format foto: **PNG (transparan)**, **JPG**, **WEBP**, **PSD (Photoshop)**, **ICO**, **PCX**, **SVG**, **AVG**, **BMP**, **TIFF**.

            ---

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan pasang langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
