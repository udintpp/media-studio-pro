name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: "MediaStudio Pro v1.6.0 - Kembang Api Spektakuler & Realistic Pyrotechnic Simulation"
          body: |
            ## 🎆 MediaStudio Pro v1.6.0 — Simulasi Kembang Api Alami & Spektakuler

            Pembaruan **v1.6.0** menghadirkan perombakan total mesin partikel kembang api menjadi simulasi piroteknik realistis berskala besar:

            ---

            ### 🚀 Fitur Baru & Peningkatan di v1.6.0:

            1. 🎆 **Simulasi Piroteknik Kembang Api Alami (Bebas Efek Kartun):**
               - **Jejak Ekor Cahaya Sejati (Luminous Motion Streaks / Comet Tails):** Menggantikan titik lingkaran kartun dengan garis berkilau dinamis mengikuti vektor kecepatan partikel dan waktu rana alami.
               - **Inti Pijar Bersuhu Tinggi (Incandescent White-Hot Core):** Setiap butir kembang api memiliki inti putih menyala diiringi pendaran halasi warna kimia piroteknik (Strontium Red, Copper Cyan, Barium Green, Cesium Violet, Sodium Gold, Silver Titanium).
               - **Fisika Balistik Aerodinamis:** Ledakan ekspansi cepat seketika yang kemudian melambat anggun akibat hambatan udara (drag resistance).
               - **Lengkungan Gravitasi Weeping Willow / Kamuro:** Percikan api melengkung jatuh ke bawah secara alami menyerupai air terjun emas kembang api kelas dunia.

            2. 🌌 **Percikan Ekstra Lebar (Screen-Filling Spread):**
               - Radius ledakan ditingkatkan drastis mencapai 35% s/d 55% dari lebar/tinggi layar (diameter mencapai 800px – 1200px pada layar Full HD), memenuhi langit malam dengan megah.

            3. 💥 **Koreografi Multi-Shell & Bintang Crackles ("Dragon Eggs"):**
               - Koreografi 3 hingga 8 selongsong roket kembang api simultan yang meluncur bergantian dari bawah dengan asap dorong pijar.
               - Kilauan bintang pecah berkeretak (scintillating crackles / time-rain popping) pada fase akhir ledakan bunga api.
               - Konstruksi selongsong multi-lapis: Peony luar berkecepatan tinggi dengan inti pistil emas kontras di tengah.

            4. ⚡ **Performa & 60 FPS Export:**
               - Rendering efisien tanpa beban garbage collection dengan objek canvas paint teroptimasi.

            ---

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan pasang langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
