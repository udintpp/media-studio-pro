name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "MediaStudio Pro v1.3.0 - Latar Transparan Penuh & Format Lengkap Foto & Video"
          body: |
            ## 🎨 MediaStudio Pro v1.3.0 - Background Transparan Penuh & Format Lengkap (Foto & Video)

            Rilis pembaruan besar **MediaStudio Pro v1.3.0** menghadirkan pemenuhan penuh permintaan pengguna terkait background transparan dan pilihan format export terlengkap:

            ### 🚀 Fitur Unggulan Baru v1.3.0:
            1. 🏁 **Background Transparan Penuh (Motif Papan Catur):**
               - Saat background foto dihapus (AI / Flood Fill / Pipet / Kuas), latar belakang otomatis menjadi **100% transparan** dengan motif papan catur (*transparency checkerboard*) profesional.
               - Latar transparan dipertahankan utuh saat export ke format yang mendukung alpha channel.
               - Latar baru HANYA muncul jika pengguna secara eksplisit memilih **Ganti Background** (foto galeri, warna putih/hitam/neon).
               - Tombol **✨ BG Transparan Murni** untuk mengembalikan latar ke transparan kapan saja.

            2. 🎥 **Hapus & Ganti Background Video (Chroma Key & Transparansi):**
               - **Hapus BG Video:** Tandai warna latar video dengan Pipet, atau gunakan preset Layar Hijau (*Green Screen*) / Layar Biru (*Blue Screen*).
               - **Ganti BG Video:** Pilihan mengganti background video dengan Foto dari Galeri, Video lain dari Galeri, atau Warna Solid baru.
               - **Pratinjau Langsung (Live Preview):** Thumbnail floating overlay menampilkan hasil pemotongan latar secara instan dengan motif papan catur transparan.

            3. 📁 **Pilihan Format Export Foto Terlengkap:**
               - **PNG:** Lossless, mendukung transparansi penuh (Alpha Channel).
               - **JPG / JPEG:** Kompresi foto standar hemat memori.
               - **WEBP:** Format modern Google, mendukung transparansi & hemat ukuran.
               - **GIF:** Format grafis 256 warna dengan transparansi.
               - **ICO:** Format ikon Windows 32-bit ARGB untuk desktop & favicon.
               - **PSD:** Dokumen Adobe Photoshop multi-channel dengan channel Alpha.
               - **PCX:** Format klasik ZSoft PC Paintbrush 24-bit RGB.
               - **SVG & AVG:** Scalable Vector Graphics XML & Android Vector Drawable XML.
               - **BMP:** Windows Bitmap 32-bit uncompressed dengan alpha.
               - **TIFF:** Tagged Image File Format profesional dengan unassociated alpha.

            4. 🎬 **Pilihan Format Export Video Terlengkap:**
               - **MP4:** Standar universal H.264 / H.265 Ultra HD hingga 4K.
               - **MOV:** Apple QuickTime video format.
               - **WEBM:** VP8 / VP9 dengan dukungan video transparan (Alpha Channel).
               - **MKV:** Matroska multimedia container.
               - **AVI:** Audio Video Interleave klasik.
               - **3GP:** Format ringan ponsel mobile.
               - **GIF Animasi Video:** Konversi cuplikan video bergerak dengan background transparan untuk stiker WA/Telegram.

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan instal langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
