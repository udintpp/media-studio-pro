name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "MediaStudio Pro v1.7.0 - After Effects Studio: BG Custom, Resize, Crop, Zoom, Flip & Manual Size (px/cm/inch)"
          body: |
            ## 🎨 MediaStudio Pro v1.7.0 — Fitur After Effects Studio Terlengkap!

            Pembaruan **v1.7.0** melengkapi After Effects Studio di MediaStudio Pro dengan kendali komposisi tingkat profesional:

            ---

            ### 🚀 Fitur Baru & Peningkatan di v1.7.0:

            1. 🎨 **Latar Belakang / Background Kustom (BG Custom):**
               - **Warna Solid:** Hitam pekat, Putih studio, Biru navy, Hijau studio, dan pemilih warna custom via kode Hex (#RRGGBB).
               - **Preset Gradasi Estetik:** Sunset (Jingga-Ungu), Deep Space (Kosmik Nebula), Cyberpunk (Neon Ungu-Cyan), Emerald Gold (Hijau Zamrud-Emas), Pastel Dream, dan Dark Studio.
               - **Blur Media Asli (Bokeh Background Fill):** Efek estetik kekinian mengisi latar hitam dengan versi blur halus dari video/foto utama.
               - **Gambar Galeri Kustom:** Pasang foto apa pun dari galeri smartphone sebagai latar belakang komposisi.
               - **Transparan (Alpha Channel / PNG Canvas):** Komposisi tanpa latar untuk keperluan masking & overlay.

            2. 📐 **Resize & Skala Media (Fit, Fill, Stretch, Custom):**
               - **Fit Mode:** Tampilkan utuh proporsional tanpa terpotong.
               - **Fill Mode:** Penuhi seluruh kanvas layar.
               - **Stretch Mode:** Regangkan tepat memenuhi batas kanvas.
               - **Custom Skala:** Geser slider skala bebas dari 10% s/d 300% atau pilih preset instan (50%, 75%, 100%, 125%, 150%, 200%).
               - **Reset Posisi & Skala:** Kembali ke posisi tengah 100% dengan satu sentuhan.

            3. ✂️ **Crop & Potong Aspek Rasio:**
               - Potong video/gambar langsung di After Effects Studio.
               - **Preset Rasio Populer:** 1:1 Persegi (Instagram Feed), 9:16 Vertikal (TikTok/Reels/Shorts), 16:9 Sinematik Landscape (YouTube), 4:5 Portrait, 21:9 Ultrawide Bioskop, 3:4 Portrait Foto.
               - **Kustom Crop Manual:** Tentukan persentase potongan Kiri, Kanan, Atas, dan Bawah secara presisi.

            4. 🔍 **Zoom In / Out Pratinjau Kanvas:**
               - Kontrol floating zoom di pojok kanan atas kanvas (+, -, dan persentase zoom).
               - Zoom pratinjau fleksibel dari 25% hingga 400% untuk memeriksa detail partikel, teks, dan efek mikro.
               - Sentuh label zoom atau tombol toolbar untuk membuka dialog pilihan zoom cepat atau reset ke 100%.

            5. 🪞 **Flip & Cermin Media:**
               - **Flip Horizontal (Cermin Kiri-Kanan / Sumbu X).**
               - **Flip Vertikal (Cermin Atas-Bawah / Sumbu Y).**
               - **Balik Keduanya (Rotasi cermin 180°).**
               - **Reset Cermin** kembali ke tampilan asli.

            6. 📏 **Dimensi Komposisi Manual (Pixel, CM, Inci dengan DPI):**
               - Tentukan ukuran kanvas secara manual menggunakan satuan **Pixel (PX)**, **Centimeter (CM)**, atau **Inci (INC)**.
               - **Kalkulasi Akurat DPI:** Dukungan DPI layar & cetak (72 DPI Web, 150 DPI Draft, 300 DPI High-Res Cetak, 600 DPI Ultra).
               - **Preset Cetak Standar:** A4 Print (21.0 × 29.7 cm @ 300 DPI = 2480 × 3508 px), A5 Print (14.8 × 21.0 cm), Foto 4R (4 × 6 inci), TikTok/Reels (1080 × 1920), Full HD (1920 × 1080), 4K UHD (3840 × 2160).

            ---

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan pasang langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
