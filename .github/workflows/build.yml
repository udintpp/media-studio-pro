name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "MediaStudio Pro v1.1.0 - AI Background Remover & Kuas Pemulih"
          body: |
            ## 🎨 MediaStudio Pro v1.1.0 - AI Background Remover & Kuas Pemulih

            Rilis pembaruan **MediaStudio Pro v1.1.0** menghadirkan teknologi AI cerdas untuk memisahkan latar belakang tanpa menghapus bagian tubuh, baju, rambut, atau wajah seseorang!

            ### 🚀 Pembaruan Utama v1.1.0:
            - 🧠 **AI Hapus BG (Google ML Kit Neural Network):** Menggunakan model AI canggih di perangkat untuk mendeteksi figur manusia, wajah, rambut, dan pakaian secara presisi. Bagian orang dijamin tidak akan terhapus meskipun warna pakaian mirip dengan latar belakang!
            - ⚡ **Smart Boundary Flood Fill:** Algoritma segmentasi tepi yang melacak background hanya dari perbatasan luar foto dan melindungi warna kulit manusia (*Skin Tone Protection*) serta mengisi lubang interior pakaian (*Hole-Filling*).
            - 🖌️ **Kuas Pemulih (Restore Brush):** Anda dapat mengusapkan jari ke layar untuk mengembalikan bagian foto yang tidak sengaja terhapus secara instan langsung dari foto asli.
            - 🧹 **Kuas Penghapus (Eraser Brush):** Usapkan jari untuk membersihkan sisa background yang sulit dijangkau secara manual.
            - ✋ **Peralihan Mode Sentuh:** Beralih dengan mudah antara mode kuas dan mode geser/stiker normal.

            - ✂️ **Potong & Sambung Video:** Trim video presisi milidetik dan sambungkan beberapa klip video menjadi satu.
            - 🖼️ **Ekstrak Frame Video:** Tangkap foto momen video dalam resolusi asli/4K secara instan atau beruntun.
            - 🔍 **Pencarian Emotikon & Stiker Google/Web:** Cari emotikon Unicode lengkap dan stiker web GIF/PNG transparan langsung dari keyword pencarian.
            - 🎵 **Mixer Audio Multi-Track & Efek Lengkap:** Ganti audio video, atur volume multi-track, speed tempo (0.5x - 2.0x), pitch shift (Chipmunk & Deep Voice), serta equalizer bass booster.
            - 📷 **Akses Kamera & Galeri:** Tangkap foto/video langsung lewat kamera HP atau pilih dari galeri.

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan instal langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
