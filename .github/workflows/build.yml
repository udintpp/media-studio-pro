name: Build MediaStudio Pro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MediaStudio Pro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaStudio-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "MediaStudio Pro v1.4.0 - Adobe After Effects Studio Tools & VFX Engine"
          body: |
            ## ⚡ MediaStudio Pro v1.4.0 - Fitur & Tools Adobe After Effects Studio Lengkap

            Rilis pembaruan besar **MediaStudio Pro v1.4.0** menghadirkan modul studio baru: **Adobe After Effects Studio Pro** yang membawa kapabilitas efek visual (VFX), animasi motion graphics, dan komposisi video tingkat bioskop langsung ke smartphone Android Anda!

            ---

            ### 🚀 Fitur Unggulan Adobe After Effects Studio (v1.4.0):

            1. ⏱️ **Keyframe Animation Timeline Engine & Easing:**
               - Sisipkan titik keyframe dinamis untuk **Posisi (X, Y)**, **Skala (Scale)**, **Rotasi (Rotation)**, **3D Tilt X**, **3D Pan Y**, dan **Opasitas (Opacity)** di setiap milidetik timeline.
               - Interpolasi kurva kurva animasi: **Easy-Ease (Hermite)**, **Linear**, **Ease-In**, **Ease-Out**, **Bounce (Pegas)**, dan **Elastic (Osilasi)**.
               - Pratinjau transport playback instan (Play/Pause, Scrubbing seekbar, indikator jumlah keyframe aktif).

            2. 🧊 **3D Layer Space (After Effects 3D Switch):**
               - Transformasi layer dalam ruang 3 dimensi berbasis kamera perspektif Android: **3D Tilt X (Pitch)**, **3D Pan Y (Yaw)**, dan jarak kamera Z.

            3. 🎭 **Masking & Rotoscoping Engine:**
               - Pemotongan area dengan Shape Masks: **Kotak Persegi (Rectangle)** dan **Lingkaran Oval (Ellipse)**.
               - Fitur **Mask Feathering** (tepi halus) dan **Invert Mask** (pembalikan area luar).

            4. ⚡ **Speed Ramping & Time Remapping:**
               - Pengaturan kecepatan dinamis: Super Slow-Mo (0.25x), Slow Motion (0.5x), Normal (1.0x), Cepat (1.5x), Hyperlapse (2.0x), serta **Putar Mundur (Reverse Time)**.

            5. ☀️ **CC Light Rays (Volumetric God Rays):**
               - Pancaran berkas sinar cahaya volumetrik berkilau memancar dramatis dari pusat hotspot cahaya dengan rotasi angular dinamis.

            6. 🌊 **Turbulent Displace (Liquify Distort):**
               - Distorsi riak gelombang cairan, efek panas atmosferik, dan asap dinamis khas After Effects.

            7. 🌀 **CC Radial Fast Blur (Zoom Blur):**
               - Efek zoom burst radial eksplosif ke arah pusat untuk transisi aksi berkecepatan tinggi.

            8. ⚡ **Saber Laser & Neon Edge Glow:**
               - Kontur garis tepi laser berenergi tinggi bercahaya neon ala plugin Video Copilot Saber.

            9. 🎨 **Lumetri Color Grading Curves:**
               - Koleksi grading warna bioskop: **Teal & Orange Hollywood**, **Cyberpunk Neon**, **Film Noir B&W Dramatis**, **Matrix Emerald**, dan **Vintage Golden Hour**.

            10. 🌟 **Optical Deep Glow (VFX Radiance):**
               - Efek pendaran cahaya optik neon pekat (*radiance glow*) dengan ambang batas dinamis, radius difusi sehalus studio bioskop, dan pilihan palet warna neon.

            11. ⚡ **RGB Split & Glitch Distortion:**
               - Simulasi aberasi kromatik kanal warna Red dan Cyan terpisah bergaya cyberpunk.
               - Dilengkapi pemisah baris pindai horizontal (*scanlines*) dan jittering acak berkecepatan tinggi.

            12. 📳 **Camera Wiggle Shake (`wiggle(freq, amp)`):**
               - Simulasi goyangan kamera genggam organik natural (*handheld camera shake*) ala ekspresi After Effects `wiggle(freq, amp)` dengan pengaturan frekuensi (Hz) dan amplitudo getaran.

            13. ☀️ **Anamorphic Lens Flare Sinematik:**
               - Kilatan lensa bioskop Hollywood dengan garis streak horizontal cyan/emas, cincin refleksi aberasi optik sekunder, dan titik pusat cahaya (*hotspot flare*).

            14. ✨ **Particle World Simulation (Simulasi Partikel Fisik):**
               - **Sparks & Embers:** Percikan api dan bara melayang dinamis dengan simulasi gravitasi dan peluruhan ukuran.
               - **Rain & Mist:** Simulasi atmosferik tetesan hujan deras sinematik dengan kabut.
               - **Snow Drift:** Butiran salju melayang lembut dengan pengaruh turbulensi angin acak.
               - **Bokeh Orbs:** Lingkaran bias cahaya aperture lebar lensa fotografi dengan kedalaman optik (*depth of field*).

            15. 🎞️ **35mm Celluloid Film Grain:**
               - Tekstur butiran film analog 35mm dengan getaran eksposur halus khas proyektor bioskop klasik.

            16. 🔤 **Kinetic Motion Graphics Typography:**
               - Animasikan teks judul dengan gaya: **Typewriter** (efek mesin tik per huruf), **Kinetic Pop Zoom**, **Neon Pulse**, dan **Glitch Distortion**.

            17. 🎵 **Audio Waveform Spectrum Visualizer:**
               - Visualisasi grafis gelombang frekuensi suara neon interaktif yang bereaksi terhadap dentuman audio.

            18. 🎭 **Layer Blending Modes Profesional:**
                - Pilihan mode perpaduan layer: **Normal**, **Add (Linear Dodge)**, **Screen**, **Multiply**, **Overlay**, **Lighten**, **Darken**, dan **Difference / XOR**.

            19. 🎬 **Export Resolusi Tinggi Hingga 4K & Format Terlengkap:**
                - Pilihan resolusi: **4K Ultra HD (3840x2160)**, **2K QHD**, **1080p Full HD**, **720p HD**, dan **Ukuran Asli**.
                - Format video: **MP4**, **MOV**, **WEBM (dengan alpha channel)**, **MKV**, **AVI**, **3GP**, dan **GIF Animasi**.
                - Format foto: **PNG (transparan)**, **JPG**, **WEBP**, **PSD (Photoshop)**, **ICO**, **PCX**, **SVG**, **AVG**, **BMP**, **TIFF**.

            ---

            ### 📲 Unduh & Instal:
            Unduh file `app-debug.apk` di bawah ini dan pasang langsung di smartphone Android Anda.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
